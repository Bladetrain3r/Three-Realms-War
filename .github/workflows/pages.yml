name: pages
# Publishes the built game (dist/) to GitHub Pages. The repository owner must enable Pages with "GitHub Actions" as the source
# (Settings > Pages) once; this workflow does not change any repository setting.
on:
  push:
    branches: [main, claude/busy-darwin-4npuil]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/bundle.mjs --out dist --build "${GITHUB_SHA::7}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
