<!doctype html>
<meta charset="utf-8">
<title>Three Realms: determinism check</title>
<script type="module">
// Runs the deterministic core in the browser: the same golden inputs, with Math.random, Date and performance.now trapped.
import { createReplay, indexContent, hashOf, canonical, sha256Hex, contentHashOf } from '/sim/index.js';

try {
  const FILES = ['realms', 'statuses', 'heroes', 'skills', 'monsters', 'items', 'tables', 'names', 'runbook', 'starter_runbooks'];
  const raw = {};
  for (const f of FILES) raw[f] = await (await fetch(`/content/${f}.json`)).json();
  const content = indexContent(raw);
  const inputs = await (await fetch('/inputs.json')).json();

  const saved = { random: Math.random, D: globalThis.Date, now: performance.now };
  const boom = (what) => () => { throw new Error('sim touched ' + what); };
  Math.random = boom('Math.random');
  globalThis.Date = new Proxy(saved.D, { construct: boom('new Date'), apply: boom('Date()'), get: (t, k) => (k === 'now' ? boom('Date.now') : Reflect.get(t, k)) });
  performance.now = boom('performance.now');
  let replays;
  try {
    contentHashOf(content);
    replays = inputs.map((inp) => { const r = createReplay(inp, content); return { seed: r.seed, hash: r.hash, events: r.events.length, outcome: r.result.outcome }; });
  } finally { Math.random = saved.random; globalThis.Date = saved.D; performance.now = saved.now; }

  const sample = { schema: 1, kind: 'x', z: [3, 1, 2], a: { y: 2, b: 1 } };
  window.__result = {
    userAgent: navigator.userAgent,
    contentHash: contentHashOf(content),
    replays,
    vectors: { abc: sha256Hex(new TextEncoder().encode('abc')), canonical: canonical(sample), canonicalHash: hashOf(sample) },
  };
} catch (e) {
  window.__error = String(e && e.stack || e);
}
</script>
